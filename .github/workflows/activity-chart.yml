name: Activity chart

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate chart
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: Shuh3n
        run: node .github/scripts/activity-chart.mjs

      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-chart.svg
          git diff --staged --quiet || (git commit -m "chore: actualiza grafica de actividad [skip ci]" && git push)
