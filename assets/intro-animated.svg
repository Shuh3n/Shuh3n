<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 600 50'
    style='background-color: #00000000;'
    width='600px' height='50px'>

    <style>
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 800;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

    <style>
        .line { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 20px; fill: #2488F8; opacity: 0; }
    </style>

    <text class="line" x="50%" y="25" text-anchor="middle" dominant-baseline="middle">
        Ingeniería de Sistemas y Computación
        <animate id="l1" attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.85;1" dur="2600ms" begin="0s;l3.end" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0,12;0,0;0,0;0,-12" keyTimes="0;0.2;0.85;1" dur="2600ms" begin="0s;l3.end" fill="freeze"/>
    </text>
    <text class="line" x="50%" y="25" text-anchor="middle" dominant-baseline="middle">
        Universidad del Quindío - Colombia
        <animate id="l2" attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.85;1" dur="2600ms" begin="l1.end" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0,12;0,0;0,0;0,-12" keyTimes="0;0.2;0.85;1" dur="2600ms" begin="l1.end" fill="freeze"/>
    </text>
    <text class="line" x="50%" y="25" text-anchor="middle" dominant-baseline="middle">
        Apasionado por el desarrollo de software
        <animate id="l3" attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.85;1" dur="2600ms" begin="l2.end" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0,12;0,0;0,0;0,-12" keyTimes="0;0.2;0.85;1" dur="2600ms" begin="l2.end" fill="freeze"/>
    </text>
</svg>
