<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 460 40'
    style='background-color: #00000000;'
    width='460px' height='40px'>

    <style>
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 800;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

    <style>
        .title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 22px; fill: #2488F8; opacity: 0; }
    </style>

    <text class="title" x="0" y="24" text-anchor="start">
        📊 Estadísticas de GitHub
        <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="700ms" begin="0s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="-16,0;0,0" keyTimes="0;1" dur="700ms" begin="0s" fill="freeze"/>
    </text>
</svg>
